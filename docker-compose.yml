services:
  # ============================================
  # BACKEND API
  # ============================================
  backend:
    image: ghcr.io/netslayer67/mws-app-be:latest
    container_name: mws-backend
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - FRONTEND_URL=https://app.millenniaws.sch.id
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - SESSION_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=https://app.millenniaws.sch.id/auth/google/callback
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GOOGLE_AI_MODEL=gemini-flash-latest
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - RATE_LIMIT_WINDOW=15
      - RATE_LIMIT_MAX_REQUESTS=600
      - CACHE_TTL=3600
      - LOG_LEVEL=info
    networks:
      - mws-network

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    image: ghcr.io/netslayer67/mws-app-fe:latest
    container_name: mws-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - mws-network

networks:
  mws-network:
    driver: bridge
