name: BE Staging CI/CD

on:
  push:
    branches: ["TESTING"]
  pull_request:
    branches: ["TESTING"]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Cypress E2E"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mws-app-be

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: BE Quality Gate
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: ESLint (if available)
        run: |
          if npm run | grep -q "lint:strict"; then
            npm run lint:strict
          elif npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No lint script found, skipping."
          fi

      - name: Unit tests
        run: |
          if npm run | grep -q "test:smoke"; then
            npm run test:smoke -- --testTimeout=60000
          else
            npm test -- --ci
          fi
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
          MONGODB_URI: mongodb://localhost:27017/integra-learn-test
          SLACK_BOT_TOKEN: ""
          SLACK_APP_TOKEN: ""
          GOOGLE_CLIENT_ID: dummy-client-id-for-ci
          GOOGLE_CLIENT_SECRET: dummy-client-secret-for-ci
          GOOGLE_REDIRECT_URL: http://localhost:3000/auth/google/callback
          GOOGLE_AI_API_KEY: dummy-api-key-for-ci

      - name: E2E tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true' }}
        run: npm run test:cypress

  build_and_push:
    name: Build & Push BE Staging Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/TESTING'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-latest
            type=sha,prefix=staging-
            type=raw,value=staging-${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
